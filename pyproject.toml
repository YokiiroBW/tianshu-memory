[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshu-memory"
version = "0.1.0"
description = "Versioned, scoped person and memory service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "pillow>=12.3.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "av>=19.0.1",
]

[project.scripts]
tianshu-memory = "tianshu_memory.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.28,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
